<!doctype html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>แบบ 2 · บัตรตอกเวลา — Famai Motor</title>
<script>try{var d=localStorage.getItem('famai_login_dark');if(d==='1'||(d===null&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.dataset.theme='dark';}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============ แบบ 2 · บัตรตอกเวลา ============
   แนวคิด: คุณไม่ได้กำลังพิสูจน์ตัวตน คุณกำลัง**เริ่มกะ**
           จอจึงขึ้นนาฬิกาเดินจริงกับวันที่ พ.ศ. ตัวใหญ่มาก่อนเป็นอันดับแรก แล้วค่อยถามว่าคุณเป็นใคร
   ต่างจากตัวอื่น: เวลาเป็นพระเอก · รายชื่อเป็นแถวยาวที่มี "สถานะกะ" อยู่ท้ายแถว
   ฟอนต์: IBM Plex Sans Thai 400/500/600 (ทั้งหน้า) + IBM Plex Mono 400/600 เฉพาะตัวเลขนาฬิกาและเงิน
          Plex คือฟอนต์ของงานที่มีบันทึกเวลา มันดูเหมือน "อุปกรณ์" ไม่ใช่ "เว็บ"
          ⚠ IBM Plex Mono ไม่มีกลิฟไทย — stack จึงต้องมี IBM Plex Sans Thai ตามหลังเสมอ
            ไม่งั้นข้อความไทยที่เผลอไปโดน --f-num จะตกไปฟอนต์ระบบ
   สี: เกือบโมโนโครม เทาหินชนวน · เขียว --pos = มาแล้ว · เหลือง --attn = ยังไม่ลงเวลา
       **แดงสงวนไว้คำเดียวคือ "สาย"** กับปุ่มเข้าระบบ — ทั้งจอมีแดงแค่สองที่
   แดงใช้ตรงไหน: คำว่า "สาย" + ปุ่มเข้าสู่ระบบ
   จุดอ่อน: **สถานะกะคือข้อมูลพนักงานที่โผล่ก่อนล็อกอิน** ใครเปิด URL ก็เห็นว่าใครมาสาย
            ของจริงต้องตัดออก หรือเหลือแค่ "กะนี้มี 6 คน" · และนาฬิกาคือ setInterval ตัวใหม่
            ที่ต้องหยุดตอนเข้าระบบ ไม่งั้นวิ่งค้างทั้งวัน (ที่นี่ทำเป็นตัวอย่างไว้แล้ว)
   ราคาพอร์ต: กลาง
   ============================================= */
:root{
  --paper:#EEF0F3; --paper-2:#E3E7EC; --card:#FFFFFF; --dark:#12151A;
  --ink:#12151A; --ink-soft:#39404A; --muted:#5E6672;
  --hairline:rgba(18,21,26,.16); --hairline-2:rgba(18,21,26,.08);
  --accent:#C8000F; --accent-hover:#E4222F; --accent-deep:#9B000C; --accent-wash:rgba(200,0,15,.07);
  --pos:#166B41; --attn:#8A5309;
  --grp1:#8F0912; --grp2:#2A5470; --grp3:#166B41; --grp4:#7A5010; --grp5:#54406F; --grp6:#4A525C;
  --on-grp:#FFFFFF;
  /* สีตัวอักษรบนปุ่มแดง — ธีมมืดใช้แดงอ่อนกว่า ตัวขาวจะเหลือคอนทราสต์ 3.3 ไม่ผ่าน
     จึงต้องมี token ของตัวเองเหมือน --on-grp */
  --on-accent:#FFFFFF;
  --s-half:4px; --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:48px; --s6:64px;
  /* มุมโค้งน้อย — อุปกรณ์ในโรงงานไม่มีมุมมน */
  --r-input:5px; --r-card:6px; --r-lg:8px; --r-btn:6px; --r-pill:999px;
  --t-label:12px; --t-table:14px; --t-body:15px; --t-lead:18px;
  --t-h2:20px; --t-h1:26px; --t-stat:30px; --t-display:58px;
  --f-display:'IBM Plex Sans Thai',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai',system-ui,sans-serif;
  --f-num:'IBM Plex Mono','IBM Plex Sans Thai',ui-monospace,monospace;
  --sh-sm:0 1px 0 rgba(18,21,26,.07); --sh-md:0 2px 6px rgba(18,21,26,.09);
  --sh-lg:0 12px 34px rgba(18,21,26,.14); --glow:none;
  --ease:cubic-bezier(.2,.8,.3,1); --dur-ui:.18s;
}
html[data-theme="dark"]{
  --paper:#0E1116; --paper-2:#12161C; --card:#171B22; --dark:#080A0D;
  --ink:#E7EAEF; --ink-soft:#BFC5CE; --muted:#949BA6;
  --hairline:rgba(231,234,239,.18); --hairline-2:rgba(231,234,239,.09);
  --accent:#FF4a54; --accent-hover:#FF747C; --accent-deep:#C8000F; --accent-wash:rgba(255,74,84,.11);
  --pos:#3DBA7A; --attn:#DC9130;
  --grp1:#FF7A82; --grp2:#7CAFDA; --grp3:#3DBA7A; --grp4:#DC9130; --grp5:#AB8AD8; --grp6:#9AA2AE;
  --on-grp:#0E1116;
  --on-accent:#12151A;
  --sh-sm:0 1px 0 rgba(0,0,0,.5); --sh-md:0 2px 6px rgba(0,0,0,.5); --sh-lg:0 12px 34px rgba(0,0,0,.6);
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{ background:var(--paper); color:var(--ink); font-family:var(--f-body);
  font-size:var(--t-body); line-height:1.5; -webkit-font-smoothing:antialiased; }
.off{ display:none !important; }
.i{ width:20px; height:20px; flex:0 0 20px; }
.i-sm{ width:15px; height:15px; flex:0 0 15px; }
button,input{ font:inherit; color:inherit; }

/* ---------------- LOGIN ---------------- */
#login{ min-height:100dvh; display:flex; flex-direction:column; align-items:center;
  padding:var(--s3) var(--s3) 96px; }
.pane{ width:min(880px,100%); }

/* แถบนาฬิกา — พระเอกของแบบนี้ */
.clock{ background:var(--dark); color:#F2F4F7; border-radius:var(--r-lg);
  padding:var(--s4) var(--s4) var(--s3); display:grid; gap:var(--s1);
  grid-template-columns:1fr auto; align-items:end; }
.clock .lbl{ grid-column:1/-1; font-size:var(--t-label); letter-spacing:.2em;
  color:rgba(242,244,247,.72); }
#lgClock{ font-family:var(--f-num); font-size:var(--t-display); font-weight:600;
  line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
#lgClock small{ font-size:var(--t-h2); font-weight:400; color:rgba(242,244,247,.72); margin-left:6px; }
.clock .dt{ text-align:right; font-size:var(--t-table); color:rgba(242,244,247,.82); }
.clock .dt b{ display:block; font-weight:600; font-size:var(--t-lead); color:#F2F4F7; }

.board{ background:var(--card); border:1px solid var(--hairline-2); border-radius:var(--r-lg);
  margin-top:var(--s2); padding:var(--s3); box-shadow:var(--sh-sm); }
.board h2{ font-size:var(--t-h2); font-weight:600; }
.hint{ color:var(--muted); font-size:var(--t-table); margin-bottom:var(--s2); }

/* รายชื่อ = แถวเต็มความกว้าง มีสถานะกะท้ายแถว */
#lgUsers{ display:grid; }
.lg-u{ display:grid; grid-template-columns:1fr auto; align-items:center; gap:var(--s1) var(--s2);
  width:100%; text-align:left; min-height:56px; padding:var(--s1) var(--s2);
  background:none; border:0; border-top:1px solid var(--hairline-2); cursor:pointer;
  border-left:3px solid transparent;
  transition:background var(--dur-ui) var(--ease); }
.lg-u:first-child{ border-top:0; }
@media (hover:hover){ .lg-u:hover{ background:var(--paper-2); } }
.lg-u.on{ background:var(--paper-2); border-left-color:var(--ink); }
.lg-u .nm{ min-width:0; }
.lg-u b{ display:block; font-size:var(--t-body); font-weight:600;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lg-u .r{ display:block; font-size:var(--t-label); color:var(--muted);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* สถานะกะ: จุดสี + ข้อความเสมอ ห้ามสีอย่างเดียว */
.st{ display:flex; align-items:center; gap:var(--s1); font-size:var(--t-label);
  font-weight:500; white-space:nowrap; }
.st i{ width:8px; height:8px; flex:0 0 8px; border-radius:var(--r-pill); background:currentColor; }
.st time{ font-family:var(--f-num); font-variant-numeric:tabular-nums; }
.st.in{ color:var(--pos); } .st.late{ color:var(--accent); } .st.none{ color:var(--attn); }

.act{ display:flex; gap:var(--s2); align-items:center; margin-top:var(--s3);
  padding-top:var(--s3); border-top:1px solid var(--hairline); }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--s1);
  min-height:48px; padding:0 var(--s4); background:var(--accent); color:var(--on-accent); border:0;
  border-radius:var(--r-btn); font-weight:600; cursor:pointer; }
@media (hover:hover){ .btn:hover{ background:var(--accent-deep); color:#fff; } }
.lnk{ display:inline-flex; align-items:center; gap:var(--s1); min-height:48px; padding:0 var(--s2);
  background:none; border:0; color:var(--ink); font-size:var(--t-table); cursor:pointer;
  border-radius:var(--r-btn); text-decoration:underline; text-underline-offset:3px; }
@media (hover:hover){ .lnk:hover{ background:var(--paper-2); } }

#lgLive h2{ font-size:var(--t-h2); font-weight:600; }
.fld{ margin-bottom:var(--s2); }
.fl{ display:block; font-size:var(--t-label); color:var(--muted); margin-bottom:var(--s-half); }
.inp{ width:100%; min-height:48px; padding:0 var(--s2); background:var(--paper);
  border:1px solid var(--hairline); border-radius:var(--r-input); }
.inp:focus{ outline:2px solid var(--accent); outline-offset:1px; }

@media (max-width:640px){
  #login{ padding:var(--s2) var(--s2) 96px; }
  .clock{ padding:var(--s3) var(--s2); grid-template-columns:1fr; gap:var(--s-half); }
  .clock .dt{ text-align:left; }
  .clock .dt b{ display:inline; font-size:var(--t-table); }
  :root{ --t-display:34px; }
  .board{ padding:var(--s2); }
  .lg-u{ grid-template-columns:1fr; min-height:64px; }
  .act{ flex-wrap:wrap; }
  .btn{ flex:1 1 100%; }
}

/* ---------------- หน้าแรก ---------------- */
#app{ min-height:100dvh; padding:var(--s3) var(--s3) 96px; }
.dsh{ max-width:1000px; margin:0 auto; display:grid; gap:var(--s2); }
.dsh-hd{ display:flex; flex-wrap:wrap; gap:var(--s2); align-items:center;
  justify-content:space-between; background:var(--dark); color:#F2F4F7;
  border-radius:var(--r-lg); padding:var(--s2) var(--s3); }
.dsh-hd b{ font-size:var(--t-h2); font-weight:600; margin-right:var(--s2); }
.dsh-hd span{ color:rgba(242,244,247,.78); font-size:var(--t-table); }
.dsh-me{ display:flex; align-items:center; gap:var(--s2); font-size:var(--t-table);
  color:rgba(242,244,247,.86); }
.dsh-out{ min-height:40px; padding:0 var(--s2); background:none; color:#F2F4F7; cursor:pointer;
  border:1px solid rgba(242,244,247,.4); border-radius:var(--r-btn); font-size:var(--t-table); }
@media (hover:hover){ .dsh-out:hover{ background:rgba(242,244,247,.14); } }
.dsh-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:var(--s2); }
.dsh-grid>.dsh-c{ grid-column:span 2; }
.dsh-c{ background:var(--card); border:1px solid var(--hairline-2);
  border-radius:var(--r-card); padding:var(--s2) var(--s3); }
.dsh-lab{ font-size:var(--t-label); color:var(--muted); letter-spacing:.04em; }
.dsh-val{ font-family:var(--f-num); font-size:var(--t-stat); font-weight:600; line-height:1.15;
  font-variant-numeric:tabular-nums; }
.dsh-val small{ font-family:var(--f-body); font-size:var(--t-table); font-weight:400;
  color:var(--muted); margin-left:5px; }
.dsh-sub{ font-size:var(--t-label); color:var(--muted); }
.t-pos .dsh-val{ color:var(--pos); } .t-attn .dsh-val{ color:var(--attn); }
.dsh-wide{ grid-column:1/-1; }
.dsh-bars{ display:flex; align-items:flex-end; gap:var(--s1); height:104px; margin-top:var(--s2); }
.dsh-bar{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:var(--s-half);
  height:100%; text-align:center; }
.dsh-bar i{ display:block; width:100%; height:var(--h); min-height:4px; border-radius:2px;
  background:var(--grp2); }
.dsh-bar span{ font-family:var(--f-num); font-size:10.5px; color:var(--muted); }
.dsh-rows{ display:grid; margin-top:var(--s1); }
.dsh-row{ display:flex; align-items:center; gap:var(--s2); padding:var(--s1) 0;
  border-top:1px solid var(--hairline-2); font-size:var(--t-table); }
.dsh-row b{ font-weight:500; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dsh-row span:not(.dsh-meter){ color:var(--muted); font-size:var(--t-label); }
.dsh-row em{ margin-left:auto; font-style:normal; font-family:var(--f-num);
  color:var(--muted); font-size:var(--t-label); font-variant-numeric:tabular-nums; white-space:nowrap; }
.dsh-dot{ width:7px; height:7px; flex:0 0 7px; border-radius:var(--r-pill); background:var(--attn); }
.dsh-meter{ flex:1; height:6px; background:var(--paper-2); border-radius:2px; overflow:hidden; }
.dsh-mfill{ display:block; height:100%; background:var(--grp2); }
@media (max-width:900px){
  #app{ padding:var(--s2) var(--s2) 96px; }
  .dsh-grid{ grid-template-columns:repeat(2,1fr); }
  .dsh-grid>.dsh-c{ grid-column:span 1; }
}
</style></head><body>

<div id="login"><div class="pane">
  <div class="clock">
    <span class="lbl">FAMAI MOTOR · เวลาเข้างาน 08:30 (ผ่อนผัน 5 นาที)</span>
    <div id="lgClock">--:--:--</div>
    <div class="dt" id="lgDate"></div>
  </div>

  <div class="board">
    <div id="lgDemo">
      <h2>ใครกำลังเริ่มกะ</h2>
      <p class="hint">แตะชื่อของคุณ แล้วกดเข้าสู่ระบบ</p>
      <div id="lgUsers"></div>
      <div class="act">
        <button class="btn" id="lgGo">เข้าสู่ระบบ</button>
        <button class="lnk" id="lgSwap"></button>
      </div>
    </div>
    <div id="lgLive" style="display:none">
      <h2>เข้าด้วยบัญชีจริง</h2>
      <p class="hint">ใช้อีเมลและรหัสผ่านที่ผู้ดูแลระบบออกให้</p>
      <div class="fld"><label class="fl" for="lgEmail">อีเมล</label>
        <input class="inp" type="email" id="lgEmail" placeholder="sales2@famai.local" autocomplete="username"></div>
      <div class="fld"><label class="fl" for="lgPw2">รหัสผ่าน</label>
        <input class="inp" type="password" id="lgPw2" autocomplete="current-password"></div>
      <div class="act">
        <button class="btn" id="lgGo2">เข้าสู่ระบบ</button>
        <button class="lnk" id="lgSwap2" type="button">กลับไปโหมดสาธิต</button>
      </div>
    </div>
  </div>
</div></div>

<div id="app" class="off"></div>

<script src="data.js"></script><script src="common.js"></script>
<script>
$('#lgGo').innerHTML  = ic('clock','i i-sm')+' เข้าสู่ระบบ';
$('#lgGo2').innerHTML = ic('clock','i i-sm')+' เข้าสู่ระบบ';
$('#lgSwap2').onclick = () => $('#lgSwap').click();

/* วันที่ พ.ศ. เต็ม */
const TH_DAY=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
(function(){ const d=new Date(D.today+'T00:00:00');
  $('#lgDate').innerHTML='วัน'+TH_DAY[d.getDay()]+'<b>'+thDate(D.today)+'</b>'; })();

/* นาฬิกาเดินจริง
   ⚠ ของจริงต้อง clearInterval ตอนเข้าระบบ ไม่งั้นตัวจับเวลาวิ่งค้างทั้งวันทั้งที่ไม่มีใครดู
   ที่นี่ทำอย่างอ่อนกว่า: เช็คว่าหน้าล็อกอินยังอยู่ไหมก่อนวาด — กลับมาหน้าเดิมแล้วเดินต่อได้เอง */
function tick(){
  if($('#login').classList.contains('off')) return;
  const n=new Date(), p=x=>String(x).padStart(2,'0');
  $('#lgClock').innerHTML = p(n.getHours())+':'+p(n.getMinutes())
    +'<small>:'+p(n.getSeconds())+'</small>';
}
tick(); setInterval(tick, 1000);

/* สถานะกะ — จุดสี + ข้อความเสมอ (กฎเหล็ก: ห้ามสื่อด้วยสีอย่างเดียว) */
function shift(s){
  const t = SHIFT[s.id];
  if(!t)            return '<span class="st none"><i></i>ยังไม่ลงเวลา</span>';
  if(t > '08:35')   return '<span class="st late"><i></i>สาย <time>'+t+'</time></span>';
  return '<span class="st in"><i></i>มาแล้ว <time>'+t+'</time></span>';
}
mountStaff(s => '<span class="nm"><b>'+esc(s.name)+'</b>'
  + '<span class="r">'+esc(staffLine(s))+'</span></span>' + shift(s));

boot(2);
</script></body></html>
