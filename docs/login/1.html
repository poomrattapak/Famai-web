<!doctype html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>แบบ 1 · ป้ายหน้าร้าน — Famai Motor</title>
<script>try{var d=localStorage.getItem('famai_login_dark');if(d==='1'||(d===null&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.dataset.theme='dark';}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Trirong:wght@600&display=swap" rel="stylesheet">
<style>
/* ============ แบบ 1 · ป้ายหน้าร้าน ============
   แนวคิด: หน้าล็อกอินมีหน้าที่เดียวคือบอกว่ามาถูกที่แล้ว แล้วให้เข้าเร็วที่สุด
           ไม่พยายามขายอะไร ไม่พยายามฉลาด — เป็นป้ายหน้าร้านที่สะอาดและอ่านง่าย
   ต่างจากตัวอื่น: นี่คือ "ของเดิม +15%" ตั้งใจให้เป็นตัวเทียบของอีก 9 แบบ
           ถ้าแบบไหนไม่ชนะตัวนี้ แปลว่าความแปลกใหม่ของมันไม่คุ้ม
   ฟอนต์: Anuphan 400/500/600 (body — x-height สูง ออกแบบมาเพื่อจอ อ่านทั้งวันไม่ล้า)
          + Trirong 600 (หัวเรื่อง serif ไทย ให้กลิ่นสิ่งพิมพ์ กันไม่ให้ดูเหมือนงานปั๊ม)
   แดงใช้ตรงไหน: เส้นขอบซ้าย 3px ของคนที่เลือก + ปุ่มหลัก + คำว่า MOTOR เท่านั้น
           แดงเป็น "ช่วงเวลา" ไม่ใช่ "พื้นผิว"
   จุดอ่อน: เจ้าของอาจดูแล้วรู้สึกว่าไม่ได้อะไรใหม่ เพราะมันคือของเดิมขัดเงา
   ราคาพอร์ต: ถูกที่สุด — สลับ token + เขียน CSS ใหม่ แก้ด่าน 0 ชุด
   =============================================== */
:root{
  --paper:#FAFAF8; --paper-2:#F2F1EC; --card:#FFFFFF; --dark:#131418;
  --ink:#15171C; --ink-soft:#3C414B; --muted:#666B75;
  --hairline:rgba(21,23,28,.13); --hairline-2:rgba(21,23,28,.055);
  --accent:#D50011; --accent-hover:#F0323F; --accent-deep:#A3000D; --accent-wash:rgba(213,0,17,.07);
  --pos:#1C7247; --attn:#9A5C0D;
  --grp1:#B3000E; --grp2:#2C5F8A; --grp3:#1F7A4D; --grp4:#A05F0F; --grp5:#6B3FA0; --grp6:#5A6472;
  /* สีตัวอักษรบนวงกลมสีกลุ่ม — ต้องเป็น token ของตัวเอง ห้ามใช้ --card/--paper
     ธีมมืดพลิกสีกลุ่มเป็นสีอ่อน ถ้ายังใช้ขาวจะได้คอนทราสต์ 2.5 อ่านไม่ออก */
  --on-grp:#FFFFFF;
  --s-half:4px; --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:48px; --s6:64px;
  --r-input:9px; --r-card:13px; --r-lg:18px; --r-btn:24px; --r-pill:999px;
  --t-label:12px; --t-table:14px; --t-body:15.5px; --t-lead:18px;
  --t-h2:21px; --t-h1:29px; --t-stat:33px; --t-display:38px;
  --f-display:'Trirong',Georgia,serif; --f-body:'Anuphan',system-ui,sans-serif; --f-num:'Anuphan',system-ui,sans-serif;
  --sh-sm:0 1px 2px rgba(21,23,28,.06); --sh-md:0 10px 28px rgba(21,23,28,.10);
  --sh-lg:0 26px 60px rgba(21,23,28,.16); --glow:0 0 34px rgba(213,0,17,.26);
  --ease:cubic-bezier(.16,1,.3,1); --dur-ui:.26s;
}
html[data-theme="dark"]{
  --paper:#101216; --paper-2:#0B0C0F; --card:#191C22; --dark:#0B0C0F;
  --ink:#ECEEF2; --ink-soft:#C6CAD2; --muted:#9BA2AD;
  --hairline:rgba(236,238,242,.17); --hairline-2:rgba(236,238,242,.08);
  --accent:#FF3E4A; --accent-hover:#FF6A73; --accent-deep:#D50011; --accent-wash:rgba(255,62,74,.11);
  --pos:#3DBA7A; --attn:#D98A2B;
  --grp1:#FF6B74; --grp2:#6EA8D9; --grp3:#3DBA7A; --grp4:#D98A2B; --grp5:#A97FD6; --grp6:#9BA3B2;
  --on-grp:#12141A;
  --sh-sm:0 1px 2px rgba(0,0,0,.45); --sh-md:0 10px 28px rgba(0,0,0,.52);
  --sh-lg:0 26px 60px rgba(0,0,0,.62); --glow:0 0 34px rgba(255,62,74,.22);
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{ background:var(--paper); color:var(--ink); font-family:var(--f-body);
  font-size:var(--t-body); line-height:1.55; -webkit-font-smoothing:antialiased; }
.off{ display:none !important; }
.i{ width:20px; height:20px; flex:0 0 20px; }
.i-sm{ width:16px; height:16px; flex:0 0 16px; }
button,input{ font:inherit; color:inherit; }

/* ---------------- LOGIN ---------------- */
#login{ min-height:100dvh; display:flex; align-items:center; justify-content:center;
  padding:var(--s3); background:var(--paper-2); }
.wrap{ display:grid; grid-template-columns:1.05fr 1fr; width:min(960px,100%);
  border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--sh-lg); }
.brand{ background:var(--dark); color:#fff; padding:var(--s5) var(--s4);
  display:flex; flex-direction:column; gap:var(--s3);
  background-image:radial-gradient(circle at 16% 6%, rgba(213,0,17,.20), transparent 56%); }
.logo{ font-family:var(--f-body); font-weight:600; font-size:var(--t-h2); letter-spacing:.1em; }
.logo b{ color:var(--accent-hover); font-weight:600; }
.tag{ font-family:var(--f-display); font-weight:600; font-size:var(--t-h1); line-height:1.32; }
.pts{ display:grid; gap:var(--s2); list-style:none; }
.pts li{ display:flex; gap:var(--s2); align-items:flex-start;
  font-size:var(--t-table); color:rgba(255,255,255,.76); line-height:1.5; }
.pts .i{ color:var(--accent-hover); margin-top:1px; }
.co{ margin-top:auto; font-size:var(--t-label); color:rgba(255,255,255,.62); }
.form{ background:var(--card); padding:var(--s5) var(--s4); }
.form h2{ font-family:var(--f-display); font-size:var(--t-h2); font-weight:600; }
.hint{ color:var(--muted); font-size:var(--t-table); margin-bottom:var(--s3); }

#lgUsers{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s1); margin-bottom:var(--s3); }
.lg-u{ display:flex; align-items:center; gap:var(--s2); text-align:left; width:100%;
  min-height:52px; padding:var(--s1) var(--s2) var(--s1) calc(var(--s1) + 3px);
  background:transparent; border:1px solid var(--hairline-2); border-left:3px solid transparent;
  border-radius:var(--r-input); cursor:pointer;
  transition:border-color var(--dur-ui) var(--ease), background var(--dur-ui) var(--ease); }
@media (hover:hover){ .lg-u:hover{ background:var(--paper-2); } }
.lg-u.on{ background:var(--paper-2); border-color:var(--hairline); border-left-color:var(--accent); }
.lg-u .av{ width:34px; height:34px; flex:0 0 34px; border-radius:var(--r-pill); color:var(--on-grp);
  display:grid; place-items:center; font-size:var(--t-table); font-weight:600; }
.lg-u .tx{ min-width:0; }
.lg-u b{ display:block; font-size:var(--t-table); font-weight:600;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lg-u .tx span{ display:block; font-size:var(--t-label); color:var(--muted);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lg-u .tick{ margin-left:auto; color:var(--accent); opacity:0; flex:0 0 16px; }
.lg-u.on .tick{ opacity:1; }

.fld{ margin-bottom:var(--s2); }
.fl{ display:block; font-size:var(--t-label); color:var(--muted); margin-bottom:var(--s-half); }
.inp{ width:100%; min-height:46px; padding:0 var(--s2); background:var(--card);
  border:1px solid var(--hairline); border-radius:var(--r-input); }
.inp:focus{ outline:2px solid var(--accent); outline-offset:1px; }
.btn{ display:flex; align-items:center; justify-content:center; gap:var(--s1); width:100%;
  min-height:50px; background:var(--ink); color:var(--paper); border:0;
  border-radius:var(--r-btn); font-weight:600; cursor:pointer;
  transition:background var(--dur-ui) var(--ease); }
.btn .i{ color:var(--accent-hover); }
@media (hover:hover){ .btn:hover{ background:var(--accent-deep); } .btn:hover .i{ color:#fff; } }
.swap{ margin-top:var(--s3); padding-top:var(--s2); border-top:1px solid var(--hairline); text-align:center; }
.lnk{ background:none; border:0; color:var(--accent); font-weight:500; cursor:pointer;
  min-height:44px; padding:0 var(--s2); border-radius:var(--r-pill); }
@media (hover:hover){ .lnk:hover{ background:var(--accent-wash); } }

@media (max-width:900px){
  #login{ padding:var(--s2); align-items:flex-start; }
  .wrap{ grid-template-columns:1fr; width:min(540px,100%); margin:auto; }
  .brand{ padding:var(--s3); gap:var(--s1); }
  .tag{ font-size:var(--t-lead); }
  .pts,.co{ display:none; }
  .form{ padding:var(--s3); }
}
@media (max-width:600px){
  #lgUsers{ grid-template-columns:1fr; gap:var(--s-half); }
  .lg-u{ min-height:48px; }
}

/* ---------------- หน้าแรก ---------------- */
#app{ min-height:100dvh; padding:var(--s3); }
.dsh{ max-width:1040px; margin:0 auto; display:grid; gap:var(--s2); }
.dsh-hd{ display:flex; flex-wrap:wrap; gap:var(--s2); align-items:baseline;
  justify-content:space-between; margin-bottom:var(--s-half); }
.dsh-hd b{ font-family:var(--f-display); font-size:var(--t-h1); font-weight:600; margin-right:var(--s2); }
.dsh-hd span{ color:var(--muted); font-size:var(--t-table); }
.dsh-me{ display:flex; align-items:center; gap:var(--s2); }
.dsh-out{ min-height:40px; padding:0 var(--s2); background:none; border:1px solid var(--hairline);
  border-radius:var(--r-pill); cursor:pointer; font-size:var(--t-table); }
@media (hover:hover){ .dsh-out:hover{ border-color:var(--accent); color:var(--accent); } }
.dsh-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:var(--s2); }
.dsh-grid>.dsh-c{ grid-column:span 2; }
.dsh-c{ background:var(--card); border:1px solid var(--hairline-2);
  border-radius:var(--r-card); padding:var(--s3); box-shadow:var(--sh-sm); }
.dsh-lab{ font-size:var(--t-label); color:var(--muted); margin-bottom:var(--s-half); }
.dsh-val{ font-family:var(--f-num); font-size:var(--t-stat); font-weight:600;
  line-height:1.1; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
.dsh-val small{ font-size:var(--t-table); font-weight:400; color:var(--muted); margin-left:6px; }
.dsh-sub{ font-size:var(--t-label); color:var(--muted); margin-top:var(--s-half); }
.t-pos .dsh-val{ color:var(--pos); } .t-attn .dsh-val{ color:var(--attn); }
.dsh-bars{ display:flex; align-items:flex-end; gap:var(--s1); height:120px; margin-top:var(--s2); }
.dsh-bar{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:var(--s-half);
  height:100%; text-align:center; }
/* แท่งกราฟ: มุมโค้งต้องเป็นค่าคงที่ ไม่ใช่ --r-pill — แท่งเตี้ยกว้างจะกลายเป็นวงรี */
.dsh-bar i{ display:block; width:100%; max-width:40px; margin:0 auto; height:var(--h);
  min-height:5px; border-radius:6px 6px 2px 2px; background:var(--accent); opacity:.85; }
.dsh-bar span{ font-size:11px; color:var(--muted); }
.dsh-rows{ display:grid; gap:var(--s-half); margin-top:var(--s2); }
.dsh-row{ display:flex; align-items:center; gap:var(--s2); padding:var(--s1) 0;
  border-top:1px solid var(--hairline-2); font-size:var(--t-table); }
.dsh-row:first-child{ border-top:0; }
.dsh-row b{ font-weight:500; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dsh-row span:not(.dsh-meter){ color:var(--muted); font-size:var(--t-label); }
.dsh-row em{ margin-left:auto; font-style:normal; color:var(--muted); font-size:var(--t-label);
  font-variant-numeric:tabular-nums; white-space:nowrap; }
.dsh-dot{ width:8px; height:8px; flex:0 0 8px; border-radius:var(--r-pill); background:var(--attn); }
.dsh-meter{ flex:1; height:8px; background:var(--paper-2); border-radius:var(--r-pill); overflow:hidden; }
.dsh-mfill{ display:block; height:100%; background:var(--grp2); border-radius:var(--r-pill); }
@media (max-width:900px){
  #app{ padding:var(--s2) var(--s2) 72px; }
  .dsh-grid{ grid-template-columns:repeat(2,1fr); }
  .dsh-grid>.dsh-c{ grid-column:span 1; }
  .dsh-c{ padding:var(--s2); }
  .dsh-hd b{ font-size:var(--t-h2); }
}
</style></head><body>

<div id="login">
  <div class="wrap">
    <aside class="brand">
      <div class="logo">FAMAI <b>MOTOR</b></div>
      <div class="tag">ระบบหลังบ้านของร้าน<br>ตั้งแต่รับรถเข้าสต๊อก จนส่งมอบและดูแลต่อ</div>
      <ul class="pts" id="pts"></ul>
      <div class="co" id="lgCo"></div>
    </aside>
    <main class="form">
      <div id="lgDemo">
        <h2>เลือกผู้ใช้เพื่อเข้าระบบ</h2>
        <p class="hint">ระบบจะแสดงเฉพาะส่วนที่บทบาทนั้นมีสิทธิ์เห็น</p>
        <div id="lgUsers"></div>
        <button class="btn" id="lgGo">เข้าสู่ระบบ</button>
      </div>
      <div id="lgLive" style="display:none">
        <h2>เข้าด้วยบัญชีจริง</h2>
        <p class="hint">ใช้อีเมลและรหัสผ่านที่ผู้ดูแลระบบออกให้</p>
        <div class="fld"><label class="fl" for="lgEmail">อีเมล</label>
          <input class="inp" type="email" id="lgEmail" placeholder="sales2@famai.local" autocomplete="username"></div>
        <div class="fld"><label class="fl" for="lgPw2">รหัสผ่าน</label>
          <input class="inp" type="password" id="lgPw2" autocomplete="current-password"></div>
        <button class="btn" id="lgGo2">เข้าสู่ระบบ</button>
      </div>
      <div class="swap"><button class="lnk" id="lgSwap"></button></div>
    </main>
  </div>
</div>
<div id="app" class="off"></div>

<script src="data.js"></script><script src="common.js"></script>
<script>
$('#lgCo').textContent = CO;
$('#pts').innerHTML = [['bike','สต๊อกรถ การขาย และงานทะเบียน อยู่ที่เดียวกัน'],
  ['cash','เงินค้างรับ ไฟแนนซ์ และรายงานส่งบัญชี'],
  ['clock','ลงเวลาเข้า-ออก พร้อมรูปและตำแหน่งจริง']]
  .map(p=>'<li>'+ic(p[0])+'<span>'+p[1]+'</span></li>').join('');
$('#lgGo').innerHTML  = 'เข้าสู่ระบบ '+ic('arrow','i i-sm');
$('#lgGo2').innerHTML = 'เข้าสู่ระบบ '+ic('arrow','i i-sm');
mountStaff((s)=> '<span class="av" style="background:var(--grp'+RGRP[s.role]+')">'+esc(lgInit(s.name))+'</span>'
  + '<span class="tx"><b>'+esc(s.name)+'</b><span>'+esc(staffLine(s))+'</span></span>'
  + ic('check','i i-sm tick'));
boot(1);
</script></body></html>
