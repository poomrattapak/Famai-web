<!doctype html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>แบบ 10 · แผ่นนิ้วโป้ง — Famai Motor</title>
<script>try{var d=localStorage.getItem('famai_login_dark');if(d==='1'||(d===null&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.dataset.theme='dark';}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Athiti:wght@600;700&family=Kodchasan:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ แบบ 10 · แผ่นนิ้วโป้ง ============
   แนวคิด: มือถือคือจอหลัก งั้นออกแบบให้มือถือก่อน 100% —
           ทุกอย่างอยู่ในระยะที่นิ้วโป้งข้างเดียวเอื้อมถึง ปุ่มยืนยันติดขอบล่างเสมอ
           **จอคอมคือแผ่นเดียวกันขนาดเดิมวางกลางจอ ไม่ขยายตามจอ — ตั้งใจ ไม่ใช่ลืม**
   ต่างจากตัวอื่น: รายชื่อเป็น **ล้อหมุน** เห็นทีละ 3 ชื่อ · โหมดสลับเป็นสองแท็บบนหัวแผ่น
   ฟอนต์: Athiti 600/700 (humanist ค่อนข้างแคบ — **ความแคบสำคัญมาก** เพราะ
          "สนุ๊กเกอร์ ทองมา · เซลล์ · Famai Motor" ต้องจบใน 1 บรรทัดที่ 390px โดยไม่โดนตัด)
          + Kodchasan 400/500 (body กลมนุ่ม)
   แดงใช้ตรงไหน: ปุ่มยืนยันใหญ่ตัวเดียว
   ⚠ ตัวอักษรบนพื้นไล่เฉดวัดคอนทราสต์อัตโนมัติไม่ได้ (เครื่องอ่านได้แค่สีทึบ)
     จึงใส่ data-nocontrast เฉพาะสองชิ้นที่อยู่บนไล่เฉดจริง — ขาว/ขาว 86% บนน้ำเงินหมึก #12203A
     ให้คอนทราสต์จริง 12.6 และ 9.8 ตรวจด้วยตาแล้ว
   จุดอ่อน: (1) เห็นทีละ 3 ชื่อ = **discoverability แย่ที่สุดใน 10 แบบ**
            (2) ล้อหมุนเลื่อนเลยง่าย ต้องมี snap แน่นและ debounce
            (3) จอคอมเสียพื้นที่ 80% ผู้บริหารที่ดูรายงานบน 27 นิ้วจะรำคาญ
            (4) **เมนูแถบล่าง = ต้องรื้อ nav ทั้งแอป** ไม่ใช่แค่หน้าล็อกอิน
   ราคาพอร์ต: หน้าล็อกอินพอร์ตง่าย แต่ **ระดับทั้งแอปแพง** เพราะโครงนำทางเปลี่ยน
   ================================================ */
:root{
  --paper:#0B1526; --paper-2:#12203A; --card:#FBFBFA; --dark:#07090D;
  --ink:#141821; --ink-soft:#3A414F; --muted:#5C6473;
  --hairline:rgba(20,24,33,.16); --hairline-2:rgba(20,24,33,.08);
  --accent:#CE0512; --accent-hover:#E82A36; --accent-deep:#9C000C; --accent-wash:rgba(206,5,18,.07);
  --pos:#166341; --attn:#7F4C09;
  --grp1:#8E0812; --grp2:#28536F; --grp3:#166341; --grp4:#6F4A10; --grp5:#503A70; --grp6:#4C525C;
  --on-grp:#FFFFFF; --on-accent:#FFFFFF;
  --on-deep:#FFFFFF; --on-deep-soft:rgba(255,255,255,.86);   /* ตัวอักษรบนพื้นไล่เฉด */
  --red-ink:#9C000C;   /* แดงที่ใช้เป็นตัวหนังสือบนแผ่น — ธีมมืดต้องอ่อนลง */
  --s-half:4px; --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:48px; --s6:64px;
  --r-input:12px; --r-card:16px; --r-lg:24px; --r-btn:16px; --r-pill:999px;
  --t-label:12.5px; --t-table:14px; --t-body:15px; --t-lead:18px;
  --t-h2:21px; --t-h1:27px; --t-stat:32px; --t-display:36px;
  --f-display:'Athiti',system-ui,sans-serif; --f-body:'Kodchasan',system-ui,sans-serif;
  --f-num:'Athiti',system-ui,sans-serif;
  --sh-sm:0 1px 2px rgba(0,0,0,.08); --sh-md:0 6px 18px rgba(0,0,0,.14);
  --sh-lg:0 -14px 40px rgba(0,0,0,.34); --glow:none;
  --ease:cubic-bezier(.2,.8,.3,1); --dur-ui:.2s;
}
html[data-theme="dark"]{
  --paper:#05080E; --paper-2:#0A1220; --card:#16181D; --dark:#000000;
  --ink:#EDEEF1; --ink-soft:#C6CAD1; --muted:#959BA5;
  --hairline:rgba(237,238,241,.18); --hairline-2:rgba(237,238,241,.09);
  --accent:#FF4A55; --accent-hover:#FF757D; --accent-deep:#CE0512; --accent-wash:rgba(255,74,85,.11);
  --pos:#43BF81; --attn:#DB9333;
  --grp1:#FF7C84; --grp2:#7EAFD8; --grp3:#43BF81; --grp4:#DB9333; --grp5:#AC8CD7; --grp6:#A0A6B0;
  --on-grp:#16181D; --on-accent:#141518;
  --red-ink:#FF9CA2;
  --sh-lg:0 -14px 40px rgba(0,0,0,.7);
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{ background:var(--paper); color:var(--ink); font-family:var(--f-body);
  font-size:var(--t-body); line-height:1.5; -webkit-font-smoothing:antialiased; }
.off{ display:none !important; }
.i{ width:20px; height:20px; flex:0 0 20px; }
.i-sm{ width:15px; height:15px; flex:0 0 15px; }
button,input{ font:inherit; color:inherit; }

/* ---------------- LOGIN ---------------- */
#login{ min-height:100dvh; display:flex; flex-direction:column; align-items:center;
  justify-content:flex-end;
  background:linear-gradient(170deg, var(--paper-2) 0%, var(--paper) 62%, var(--dark) 100%); }
.brand{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:var(--s1); padding:var(--s5) var(--s3) var(--s4); text-align:center; }
.logo{ font-family:var(--f-display); font-size:var(--t-h1); font-weight:700; letter-spacing:.06em;
  color:var(--on-deep); }
.logo b{ color:var(--accent-hover); font-weight:700; }
.slog{ font-size:var(--t-table); color:var(--on-deep-soft); }

/* แผ่นติดขอบล่าง */
.sheet{ width:min(420px,100%); background:var(--card); color:var(--ink);
  border-radius:var(--r-lg) var(--r-lg) 0 0; box-shadow:var(--sh-lg);
  padding:var(--s1) var(--s3) var(--s3); display:flex; flex-direction:column;
  height:64vh; min-height:460px; }
.grip{ width:40px; height:4px; border-radius:var(--r-pill); background:var(--hairline);
  margin:var(--s1) auto var(--s2); flex:0 0 auto; }
/* สองแท็บบนหัวแผ่น — ปุ่มจริงคือ #lgSwap ตัวเดียวตามสัญญาของด่าน */
.tabs{ display:grid; grid-template-columns:1fr 1fr; gap:2px; padding:3px; flex:0 0 auto;
  background:var(--hairline-2); border-radius:var(--r-pill); }
.tabs span,.tabs button{ min-height:44px; display:inline-flex; align-items:center;
  justify-content:center; border:0; border-radius:var(--r-pill); background:none;
  color:var(--muted); font-size:var(--t-table); font-weight:500; cursor:pointer; }
.tabs .cur{ background:var(--card); color:var(--ink); font-weight:600; box-shadow:var(--sh-sm); }
#lgDemo,#lgLive{ flex:1; display:flex; flex-direction:column; min-height:0; }
.cap{ font-size:var(--t-label); color:var(--muted); text-align:center;
  padding:var(--s2) 0 var(--s1); flex:0 0 auto; }

/* ล้อหมุน — เห็นทีละ 3 ชื่อ ตัวกลางคือตัวที่เลือก */
.wheel{ position:relative; flex:1; min-height:0; }
.wheel::before,.wheel::after{ content:''; position:absolute; left:0; right:0; height:34%;
  pointer-events:none; z-index:2; }
.wheel::before{ top:0;    background:linear-gradient(var(--card), transparent); }
.wheel::after { bottom:0; background:linear-gradient(transparent, var(--card)); }
#lgUsers{ height:100%; overflow-y:auto; scroll-snap-type:y mandatory;
  padding:33% 0; scrollbar-width:none; }
#lgUsers::-webkit-scrollbar{ display:none; }
.lg-u{ display:block; width:100%; min-height:66px; text-align:center; cursor:pointer;
  background:none; border:0; padding:var(--s1) var(--s2); scroll-snap-align:center;
  opacity:.4; transition:opacity var(--dur-ui) var(--ease); }
.lg-u b{ display:block; font-family:var(--f-display); font-size:var(--t-lead); font-weight:600;
  line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lg-u .r{ display:block; font-size:var(--t-label); color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lg-u .k{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
  color:var(--red-ink); opacity:0; }
.lg-u.on{ opacity:1; }
.lg-u.on b{ font-size:var(--t-h2); font-weight:700; }
.lg-u.on .k{ opacity:1; }

.btn{ display:flex; align-items:center; justify-content:center; gap:var(--s1); width:100%;
  min-height:56px; margin-top:var(--s2); background:var(--accent); color:var(--on-accent);
  border:0; border-radius:var(--r-btn); font-family:var(--f-display); font-size:var(--t-lead);
  font-weight:700; cursor:pointer; flex:0 0 auto; }
@media (hover:hover){ .btn:hover{ background:var(--accent-deep); color:#fff; } }
.fld{ margin-bottom:var(--s2); }
.fl{ display:block; font-size:var(--t-label); color:var(--muted); margin-bottom:var(--s-half); }
.inp{ width:100%; min-height:52px; padding:0 var(--s2); background:var(--card); color:var(--ink);
  border:1px solid var(--hairline); border-radius:var(--r-input); }
.inp:focus{ outline:2px solid var(--accent); outline-offset:1px; }
#lgLive .sp{ flex:1; }

@media (min-width:641px){ .sheet{ margin-bottom:var(--s5); border-radius:var(--r-lg); } }
@media (max-width:400px){ .sheet{ padding:var(--s1) var(--s2) var(--s2); } }

/* ---------------- หน้าแรก ---------------- */
/* เนื้อหาเลื่อนในแผ่นเดียวกัน + เมนูหลักเป็นแถบล่างในระยะนิ้วโป้ง */
#app{ min-height:100dvh; display:flex; flex-direction:column; align-items:center;
  justify-content:flex-end;
  background:linear-gradient(170deg, var(--paper-2) 0%, var(--paper) 62%, var(--dark) 100%); }
.dsh{ width:min(420px,100%); background:var(--card); border-radius:var(--r-lg) var(--r-lg) 0 0;
  box-shadow:var(--sh-lg); padding:var(--s3) var(--s3) 0; display:grid; gap:var(--s2);
  height:86vh; overflow-y:auto; align-content:start; }
.dsh-hd{ display:grid; gap:var(--s-half); }
.dsh-hd b{ font-family:var(--f-display); font-size:var(--t-h1); font-weight:700; }
.dsh-hd span{ color:var(--muted); font-size:var(--t-label); }
.dsh-me{ display:flex; align-items:center; justify-content:space-between; gap:var(--s2);
  font-size:var(--t-label); color:var(--muted); }
.dsh-out{ min-height:44px; padding:0 var(--s2); background:none; color:var(--ink); cursor:pointer;
  border:1px solid var(--hairline); border-radius:var(--r-pill); font-size:var(--t-label); }
.dsh-grid{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s1); }
.dsh-c{ background:var(--hairline-2); border-radius:var(--r-card); padding:var(--s2); }
.dsh-lab{ font-size:11px; color:var(--muted); }
.dsh-val{ font-family:var(--f-num); font-size:var(--t-stat); font-weight:700; line-height:1.1;
  font-variant-numeric:tabular-nums; }
.dsh-val small{ font-family:var(--f-body); font-size:12px; font-weight:400; color:var(--muted);
  margin-left:4px; }
.dsh-sub{ font-size:11px; color:var(--muted); }
.t-pos .dsh-val{ color:var(--pos); } .t-attn .dsh-val{ color:var(--attn); }
.dsh-wide{ }
.dsh-bars{ display:flex; align-items:flex-end; gap:5px; height:88px; margin-top:var(--s1); }
.dsh-bar{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:2px;
  height:100%; text-align:center; }
.dsh-bar i{ display:block; width:100%; height:var(--h); min-height:4px; border-radius:5px 5px 2px 2px;
  background:var(--grp2); }
.dsh-bar span{ font-size:10px; color:var(--muted); }
.dsh-rows{ display:grid; margin-top:var(--s1); }
.dsh-row{ display:flex; align-items:center; gap:var(--s1); padding:var(--s1) 0;
  border-top:1px solid var(--hairline-2); font-size:var(--t-label); }
.dsh-row b{ font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dsh-row span:not(.dsh-meter){ color:var(--muted); font-size:11px; }
.dsh-row em{ margin-left:auto; font-style:normal; color:var(--muted); font-size:11px;
  font-variant-numeric:tabular-nums; white-space:nowrap; }
.dsh-dot{ width:7px; height:7px; flex:0 0 7px; border-radius:var(--r-pill); background:var(--attn); }
.dsh-meter{ flex:1; height:6px; background:var(--card); border-radius:var(--r-pill); overflow:hidden; }
.dsh-mfill{ display:block; height:100%; background:var(--grp3); }
/* แถบเมนูล่าง — ถ้าเลือกแบบนี้ nav ทั้งแอปต้องย้ายมาอยู่ตรงนี้ */
.tabbar{ position:sticky; bottom:0; display:grid; grid-template-columns:repeat(5,1fr);
  background:var(--card); border-top:1px solid var(--hairline-2); margin:var(--s2) calc(-1*var(--s3)) 0; }
.tabbar span{ display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:var(--s1) 0 calc(var(--s1) + 4px); font-size:10px; color:var(--muted); }
.tabbar span:first-child{ color:var(--red-ink); }
</style></head><body>

<div id="login">
  <div class="brand">
    <!-- อยู่บนพื้นไล่เฉด เครื่องวัดคอนทราสต์อ่านไม่ได้ — เหตุผลอยู่ในคอมเมนต์หัวไฟล์ -->
    <div class="logo" data-nocontrast>FAMAI <b>MOTOR</b></div>
    <p class="slog" data-nocontrast>ระบบหลังบ้านของร้าน · ใช้ได้ด้วยนิ้วโป้งข้างเดียว</p>
  </div>

  <div class="sheet">
    <div class="grip"></div>
    <div class="tabs">
      <span class="cur" id="tabA">พนักงาน</span>
      <button type="button" id="lgSwap">บัญชีจริง</button>
    </div>

    <div id="lgDemo">
      <p class="cap">เลื่อนหาชื่อของคุณ แล้วกดยืนยัน</p>
      <div class="wheel"><div id="lgUsers"></div></div>
      <button class="btn" id="lgGo">เข้าสู่ระบบ</button>
    </div>

    <div id="lgLive" style="display:none">
      <p class="cap">ใช้อีเมลและรหัสผ่านที่ผู้ดูแลระบบออกให้</p>
      <div class="fld"><label class="fl" for="lgEmail">อีเมล</label>
        <input class="inp" type="email" id="lgEmail" placeholder="sales2@famai.local" autocomplete="username"></div>
      <div class="fld"><label class="fl" for="lgPw2">รหัสผ่าน</label>
        <input class="inp" type="password" id="lgPw2" autocomplete="current-password"></div>
      <div class="sp"></div>
      <button class="btn" id="lgGo2">เข้าสู่ระบบ</button>
    </div>
  </div>
</div>

<div id="app" class="off"></div>

<script src="data.js"></script><script src="common.js"></script>
<script>
$('#lgGo').innerHTML  = 'เข้าสู่ระบบ '+ic('arrow','i i-sm');
$('#lgGo2').innerHTML = 'เข้าสู่ระบบ '+ic('arrow','i i-sm');

mountStaff(s => '<b>'+esc(s.name)+'</b><span class="r">'+esc(staffLine(s))+'</span>'
  + '<span class="k">'+ic('check','i i-sm')+'เลือกอยู่</span>');

/* ล้อหมุน: ตัวที่อยู่ใกล้กึ่งกลางที่สุดคือตัวที่เลือก
   ⚠ ห้าม display:none / visibility:hidden กับใบที่อยู่นอกจอ — ทุกใบต้องคลิกได้
     (ที่นี่ใช้ opacity อย่างเดียว และ .4 ยังอ่านออก) */
const rail = () => $('#lgUsers');
function centre(){
  const r = rail(), mid = r.scrollTop + r.clientHeight/2;
  let best = null, bd = 1e9;
  $$('.lg-u', r).forEach(b => { const c = b.offsetTop + b.offsetHeight/2, d = Math.abs(c - mid);
    if (d < bd) { bd = d; best = b; } });
  if (best && !best.classList.contains('on')) {
    $$('.lg-u', r).forEach(x => x.classList.remove('on')); best.classList.add('on');
  }
}
let t = null;
rail().addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(centre, 120); });
/* คลิกใบไหนก็เลือกใบนั้น แล้วเลื่อนมากลาง */
onPick = b => b.scrollIntoView({ behavior:'smooth', block:'center' });

function afterSwap(live){
  $('#tabA').className   = live ? '' : 'cur';
  $('#lgSwap').className = live ? 'cur' : '';
  $('#lgSwap').textContent = 'บัญชีจริง';
}
$('#tabA').onclick = () => { if($('#lgLive').style.display !== 'none') $('#lgSwap').click(); };

/* แถบเมนูล่างบนหน้าแรก — ของตกแต่งเพื่อให้เห็นว่าถ้าเลือกแบบนี้ nav ทั้งแอปจะย้ายมาอยู่ล่าง */
function dashExtra(){
  const t = [['chart','หน้าแรก'],['bike','สต๊อก'],['cash','ขาย'],['users','ลูกค้า'],['wrench','ซ่อม']];
  return '<div class="tabbar">'+ t.map(x=>'<span>'+ic(x[0],'i i-sm')+x[1]+'</span>').join('') +'</div>';
}
boot(10);
afterSwap(false);
</script></body></html>
