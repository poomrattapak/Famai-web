<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>แบบ 2 · เบนโตะเน้นเงิน — Famai Motor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ แบบ 2 · เบนโตะเน้นเงิน ============
   ต่างจากตัวตั้งต้นตรง: โทนขาว-ดำเรียบ ใช้สีเน้นสีเดียว (เขียวเงิน) · การ์ดน้อยแต่ใหญ่ ·
   เรื่องที่เล่าคือ "เงินเข้า-เงินจม-เงินค้าง" ล้วน ๆ · กราฟเป็นเส้นโค้งใหญ่เต็มการ์ด
   ใช้เมื่อ: อยากรู้เรื่องเงินก่อนอย่างอื่น ไม่อยากให้สีมาดึงความสนใจ */
:root{
  --bg:#F6F6F4; --card:#FFFFFF; --ink:#0D0F12; --dim:#71767E; --line:rgba(13,15,18,.09);
  --key:#0B7A55; --key-soft:#E6F4EE; --warn:#B4541A; --r:26px;
}
html[data-theme="dark"]{ --bg:#0B0C0E; --card:#151719; --ink:#EDEEEF; --dim:#969BA3;
  --line:rgba(255,255,255,.09); --key:#38C593; --key-soft:#12241D; --warn:#E08A4A; }
@media (prefers-color-scheme:dark){ html:not([data-theme="light"]){ --bg:#0B0C0E; --card:#151719; --ink:#EDEEEF;
  --dim:#969BA3; --line:rgba(255,255,255,.09); --key:#38C593; --key-soft:#12241D; --warn:#E08A4A; } }
*{box-sizing:border-box;margin:0;padding:0}
body{ background:var(--bg); color:var(--ink); font-family:'Noto Sans Thai',system-ui,sans-serif; padding:22px 20px 30px; }
.wrap{ max-width:1120px; margin:0 auto; }
.switch{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:12px; margin-bottom:18px; }
.switch a{ color:var(--dim); text-decoration:none; padding:6px 12px; border-radius:99px; background:var(--card); }
.switch a.on{ color:var(--ink); font-weight:600; }
.switch a.home{ background:none; padding-left:0; }
.switch .tg{ margin-left:auto; background:var(--card); border:0; color:var(--dim); border-radius:99px; width:32px; height:32px; cursor:pointer; }
.top{ display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
.top h1{ font-size:25px; font-weight:700; letter-spacing:-.025em; }
.top .p{ color:var(--dim); font-size:13px; }
.bento{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.c{ background:var(--card); border-radius:var(--r); padding:26px 26px 24px; border:1px solid var(--line);
  display:flex; flex-direction:column; min-height:150px; }
.c .lab{ font-size:13px; color:var(--dim); }
.c .val{ font-size:40px; font-weight:700; letter-spacing:-.035em; line-height:1.05;
  font-variant-numeric:tabular-nums; margin-top:auto; }
.c .val small{ font-size:18px; font-weight:500; color:var(--dim); letter-spacing:0; }
.c .sub{ font-size:12.5px; color:var(--dim); margin-top:8px; }
/* การ์ดใหญ่ = เรื่องเงินหลัก กินสองแถวสองคอลัมน์ */
.c.hero{ grid-column:span 2; grid-row:span 2; padding-bottom:0; overflow:hidden; }
.c.hero .val{ font-size:clamp(44px,6.4vw,74px); margin-top:14px; }
.c.wide{ grid-column:span 2; }
.c.tall{ grid-row:span 2; }
.delta{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600;
  padding:5px 12px; border-radius:99px; background:var(--key-soft); color:var(--key); width:fit-content; }
.delta.dn{ color:var(--warn); background:transparent; box-shadow:inset 0 0 0 1px var(--line); }
.chart{ margin:16px -26px 0; }
.rowline{ display:flex; align-items:center; gap:12px; font-size:13.5px; padding:11px 0; border-top:1px solid var(--line); }
.rowline:first-of-type{ border-top:0; }
.rowline b{ margin-left:auto; font-variant-numeric:tabular-nums; }
.track{ flex:1; height:8px; border-radius:99px; background:var(--line); overflow:hidden; min-width:40px; }
.track i{ display:block; height:100%; border-radius:99px; background:var(--key); }
.gauge{ display:flex; align-items:center; gap:18px; margin-top:auto; }
.gauge .n{ font-size:30px; font-weight:700; letter-spacing:-.03em; }
.foot{ margin-top:20px; text-align:center; font-size:12px; color:var(--dim); }
@media (max-width:900px){ .bento{ grid-template-columns:repeat(2,1fr); }
  .c.hero{ grid-column:1/-1; grid-row:auto; } .c.wide{ grid-column:1/-1; } .c.tall{ grid-row:auto; } }
@media (max-width:560px){ body{padding:14px} .bento{ grid-template-columns:1fr; gap:12px; }
  .c{ min-height:0; padding:20px; } .chart{ margin:14px -20px 0; } .c .val{ font-size:34px; } }
</style></head><body>
<div class="wrap"><div id="sw"></div><div class="top" id="top"></div><div class="bento" id="app"></div>
<p class="foot">ตัวอย่างการออกแบบ · ตัวเลขจากข้อมูลสาธิตของระบบจริง — ทั้ง 6 แบบใช้ชุดตัวเลขเดียวกัน</p></div>
<script src="data.js"></script><script src="common.js"></script>
<script>
const k=D.kpi, dRev=pct(k.rev,k.prevRev), dd=daily();
const cv=curvePath(dd.map(x=>x.v), 640, 190, 14);
const margin = k.rev? k.gp/k.rev*100 : 0;
const collected = (k.rev+k.ar)? k.rev/(k.rev+k.ar)*100 : 100;
const staff=Object.entries(D.byStaff).sort((a,b)=>b[1].net-a[1].net);
const smax=Math.max(...staff.map(x=>x[1].net));
document.getElementById('sw').innerHTML = switcher('2');
document.getElementById('top').innerHTML = '<h1>เงินเข้า เงินจม เงินค้าง</h1>'
  + '<span class="p">'+D.period.text+' · อัปเดต '+thDate(D.today)+'</span>';
document.getElementById('app').innerHTML =
  '<div class="c hero"><div class="lab">ยอดขายในช่วงที่เลือก</div>'
+ '<div class="val">'+B(k.rev)+' <small>บาท</small></div>'
+ '<div class="sub" style="margin-bottom:14px"><span class="delta '+(dRev>=0?'':'dn')+'">'
+ (dRev>=0?'▲':'▼')+' '+Math.abs(dRev)+'% เทียบช่วงก่อนหน้า</span>'
+ '&nbsp;&nbsp;ขายได้ '+k.sold+' คัน · เฉลี่ยคันละ '+B(k.sold?Math.round(k.rev/k.sold):0)+' ฿</div>'
+ '<div class="chart"><svg viewBox="0 0 640 190" width="100%" height="190" preserveAspectRatio="none">'
+ '<defs><linearGradient id="gk" x1="0" y1="0" x2="0" y2="1">'
+ '<stop offset="0" stop-color="var(--key)" stop-opacity=".26"/><stop offset="1" stop-color="var(--key)" stop-opacity="0"/></linearGradient></defs>'
+ '<path d="'+cv.area+'" fill="url(#gk)"/>'
+ '<path d="'+cv.line+'" fill="none" stroke="var(--key)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>'
+ '</svg></div></div>'

+ '<div class="c"><div class="lab">กำไรขั้นต้น</div><div class="val">'+B(k.gp)+' <small>฿</small></div>'
+ '<div class="gauge" style="margin-top:14px"><svg width="76" height="76" viewBox="0 0 42 42">'
+ ringGauge(margin, 'var(--key)', 'var(--line)', 6)
+ '<text x="21" y="23.6" text-anchor="middle" font-size="8" font-weight="700" fill="currentColor">'+margin.toFixed(1)+'%</text></svg>'
+ '<div class="sub" style="margin:0">อัตรากำไรจากยอดขาย<br>ทั้งช่วงที่เลือก</div></div></div>'

+ '<div class="c"><div class="lab">เงินค้างรับ</div><div class="val">'+B(k.ar)+' <small>฿</small></div>'
+ '<div class="gauge" style="margin-top:14px"><svg width="76" height="76" viewBox="0 0 42 42">'
+ ringGauge(collected, 'var(--key)', 'var(--line)', 6)
+ '<text x="21" y="23.6" text-anchor="middle" font-size="8" font-weight="700" fill="currentColor">'+Math.round(collected)+'%</text></svg>'
+ '<div class="sub" style="margin:0">เก็บเงินได้แล้วเทียบกับ<br>ที่ควรได้ · ค้าง '+k.arN+' ราย</div></div></div>'

+ '<div class="c wide"><div class="lab" style="margin-bottom:14px">ใครทำเงินให้ร้านบ้าง</div>'
+ staff.map(([n,v])=>'<div class="rowline"><span>'+n+'</span>'
+   '<span class="track"><i style="width:'+Math.round(v.net/smax*100)+'%"></i></span>'
+   '<b>'+B(v.net)+' ฿</b></div>').join('')
+ '<div class="sub">กำไรต่อคันบอกคุณภาพของดีล — '+staff.map(([n,v])=>n+' '+B(Math.round(v.gp/v.n))+' ฿').join(' · ')+'</div></div>'

+ '<div class="c"><div class="lab">ทุนจมในสต๊อก</div><div class="val">'+B(k.cost)+' <small>฿</small></div>'
+ '<div class="sub">'+k.stock+' คันที่ยังไม่ออก · ในนั้นค้างเกิน '+D.aging+' วัน '+k.stuck+' คัน '
+ 'คิดเป็น '+Math.round(k.stuck/Math.max(1,k.stock)*100)+'% ของสต๊อก</div></div>';
setTheme();
</script>
</body></html>
