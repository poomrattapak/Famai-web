<!doctype html>
<html lang="th" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>แบบ 5 · เบนโตะมืดเรืองแสง — Famai Motor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ แบบ 5 · เบนโตะมืดเรืองแสง ============
   ต่างจากตัวอื่นตรง: มืดเป็นหลัก การ์ดมีขอบเรืองแสงและพื้นไล่เฉด · การ์ดใหญ่ไม่กี่ใบ ·
   เรื่องที่เล่าคือภาพรวมผู้บริหาร ทุกตัวเลขมีตัวเทียบช่วงก่อนหน้า · กราฟเส้นโค้งเรืองแสง
   ใช้เมื่อ: เปิดบนมือถือตอนกลางคืน หรือขึ้นจอทีวีในห้องทำงาน */
:root{
  --bg:#07080C; --card:#101219; --ink:#EEF0F5; --dim:#8B93A5; --line:rgba(255,255,255,.08);
  --g1:#5B8CFF; --g2:#22D3A5; --g3:#F0A93B; --g4:#FF6B8A; --r:24px;
}
html[data-theme="light"]{ --bg:#EEF0F6; --card:#FFFFFF; --ink:#0D1017; --dim:#5E6779;
  --line:rgba(13,16,23,.10); --g1:#2E5FD6; --g2:#0E9B78; --g3:#B4740A; --g4:#D23A5C; }
*{box-sizing:border-box;margin:0;padding:0}
body{ background:var(--bg); color:var(--ink); font-family:'Noto Sans Thai',system-ui,sans-serif;
  padding:22px 20px 30px; }
html:not([data-theme="light"]) body{
  background:radial-gradient(1000px 620px at 12% -8%, rgba(91,140,255,.16), transparent 60%),
             radial-gradient(820px 520px at 92% 4%, rgba(34,211,165,.13), transparent 62%), var(--bg); }
.wrap{ max-width:1140px; margin:0 auto; }
.switch{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:12px; margin-bottom:18px; }
.switch a{ color:var(--dim); text-decoration:none; padding:6px 12px; border-radius:99px;
  background:var(--card); border:1px solid var(--line); }
.switch a.on{ color:var(--ink); font-weight:600; border-color:var(--g1); }
.switch a.home{ background:none; border-color:transparent; padding-left:0; }
.switch .tg{ margin-left:auto; background:var(--card); border:1px solid var(--line); color:var(--dim);
  border-radius:99px; width:32px; height:32px; cursor:pointer; }
.top{ display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
.top h1{ font-size:25px; font-weight:700; letter-spacing:-.025em; }
.top .p{ color:var(--dim); font-size:13px; }
.bento{ display:grid; grid-template-columns:repeat(4,1fr); gap:15px; }
.c{ position:relative; border-radius:var(--r); padding:22px; min-height:150px;
  display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); overflow:hidden; }
/* เรืองแสงจาง ๆ ที่มุมการ์ด — ใช้ ::before จะได้ไม่ต้องซ้อน element เพิ่ม */
.c::before{ content:''; position:absolute; inset:-40% 40% 55% -30%; border-radius:50%;
  background:radial-gradient(circle, var(--glow, transparent), transparent 68%); opacity:.5; pointer-events:none; }
.c.k1{ --glow:rgba(91,140,255,.5); } .c.k2{ --glow:rgba(34,211,165,.45); }
.c.k3{ --glow:rgba(240,169,59,.4); } .c.k4{ --glow:rgba(255,107,138,.4); }
html[data-theme="light"] .c::before{ opacity:.22; }
.c .lab{ font-size:12.5px; color:var(--dim); position:relative; }
.c .val{ font-size:38px; font-weight:700; letter-spacing:-.035em; line-height:1.05; margin-top:auto;
  font-variant-numeric:tabular-nums; position:relative; }
.c .val small{ font-size:16px; font-weight:500; color:var(--dim); letter-spacing:0; }
.c .sub{ font-size:12px; color:var(--dim); margin-top:7px; position:relative; }
.c.hero{ grid-column:span 2; grid-row:span 2; padding-bottom:0; }
.c.hero .val{ font-size:clamp(42px,6vw,68px); }
.c.wide{ grid-column:span 2; }
.d{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
  padding:4px 11px; border-radius:99px; border:1px solid var(--line); width:fit-content; position:relative; }
.d.up{ color:var(--g2); } .d.dn{ color:var(--g4); }
.chart{ margin:16px -22px -1px; position:relative; }
.rowline{ display:flex; align-items:center; gap:10px; font-size:13px; padding:10px 0;
  border-top:1px solid var(--line); position:relative; }
.rowline:first-of-type{ border-top:0; }
.rowline b{ margin-left:auto; font-variant-numeric:tabular-nums; }
.spark{ margin-top:12px; position:relative; }
.foot{ margin-top:20px; text-align:center; font-size:12px; color:var(--dim); }
@media (max-width:900px){ .bento{ grid-template-columns:repeat(2,1fr); }
  .c.hero{ grid-column:1/-1; grid-row:auto; } .c.wide{ grid-column:1/-1; } }
@media (max-width:560px){ body{padding:14px} .bento{ grid-template-columns:1fr; gap:12px; }
  .c{ min-height:0; padding:18px; } .chart{ margin:14px -18px -1px; } .c .val{ font-size:33px; } }
</style></head><body>
<div class="wrap"><div id="sw"></div><div class="top" id="top"></div><div class="bento" id="app"></div>
<p class="foot">ตัวอย่างการออกแบบ · ตัวเลขจากข้อมูลสาธิตของระบบจริง — ทั้ง 6 แบบใช้ชุดตัวเลขเดียวกัน</p></div>
<script src="data.js"></script><script src="common.js"></script>
<script>
const k=D.kpi, dd=daily();
const cv=curvePath(dd.map(x=>x.v), 620, 200, 16);
const sp=curvePath(dd.map(x=>x.v), 260, 54, 5);
const avg=k.sold?Math.round(k.rev/k.sold):0, prevAvg=k.prevSold?Math.round(k.prevRev/k.prevSold):0;
const dRev=pct(k.rev,k.prevRev), dSold=pct(k.sold,k.prevSold), dAvg=pct(avg,prevAvg);
const tag=(v,txt)=>'<span class="d '+(v>=0?'up':'dn')+'">'+(v>=0?'▲':'▼')+' '+Math.abs(v)+'% '+(txt||'')+'</span>';
document.getElementById('sw').innerHTML = switcher('5');
document.getElementById('top').innerHTML = '<h1>ภาพรวมผู้บริหาร</h1>'
  + '<span class="p">'+D.period.text+' · เทียบกับ 30 วันก่อนหน้าทุกตัวเลข</span>';
document.getElementById('app').innerHTML =
  '<div class="c hero k1"><div class="lab">ยอดขายในช่วงที่เลือก</div>'
+ '<div class="val">'+B(k.rev)+' <small>บาท</small></div>'
+ '<div class="sub" style="margin-bottom:14px">'+tag(dRev,'จากช่วงก่อนหน้า ('+B(k.prevRev)+' ฿)')+'</div>'
+ '<div class="chart"><svg viewBox="0 0 620 200" width="100%" height="200" preserveAspectRatio="none">'
+ '<defs><linearGradient id="gh" x1="0" y1="0" x2="0" y2="1">'
+ '<stop offset="0" stop-color="var(--g1)" stop-opacity=".42"/><stop offset="1" stop-color="var(--g1)" stop-opacity="0"/></linearGradient>'
+ '<filter id="glow" x="-20%" y="-60%" width="140%" height="260%">'
+ '<feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>'
+ '<path d="'+cv.area+'" fill="url(#gh)"/>'
+ '<path d="'+cv.line+'" fill="none" stroke="var(--g1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>'
+ '</svg></div></div>'

+ '<div class="c k2"><div class="lab">ขายได้</div><div class="val">'+k.sold+' <small>คัน</small></div>'
+ '<div class="sub">'+tag(dSold)+' · ช่วงก่อน '+k.prevSold+' คัน</div></div>'

+ '<div class="c k3"><div class="lab">ราคาเฉลี่ยต่อคัน</div><div class="val">'+B(avg)+' <small>฿</small></div>'
+ '<div class="sub">'+tag(dAvg)+' · ช่วงก่อน '+B(prevAvg)+' ฿</div></div>'

+ '<div class="c k2"><div class="lab">กำไรขั้นต้น</div><div class="val">'+B(k.gp)+' <small>฿</small></div>'
+ '<div class="sub">อัตรากำไร '+(k.rev?(k.gp/k.rev*100).toFixed(1):0)+'% ของยอดขาย</div></div>'

+ '<div class="c k4"><div class="lab">เงินค้างรับ</div><div class="val">'+B(k.ar)+' <small>฿</small></div>'
+ '<div class="sub">'+k.arN+' รายที่ยังเก็บไม่ครบ</div></div>'

+ '<div class="c wide k1"><div class="lab">จังหวะการขายรายวัน</div>'
+ '<div class="spark"><svg viewBox="0 0 260 54" width="100%" height="60" preserveAspectRatio="none">'
+ '<path d="'+sp.line+'" fill="none" stroke="var(--g2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'
+ '<div class="sub">'+thShort(D.period.from)+' – '+thShort(D.period.to)+' · วันที่ขายดีที่สุด '+B(sp.max)+' ฿</div></div>'

+ '<div class="c wide k3"><div class="lab" style="margin-bottom:8px">อันดับเซลล์</div>'
+ Object.entries(D.byStaff).sort((a,b)=>b[1].net-a[1].net)
    .map(([n,v],i)=>'<div class="rowline"><span>'+(i+1)+'. '+n+' · '+v.n+' คัน</span><b>'+B(v.net)+' ฿</b></div>').join('')
+ '</div>'

+ '<div class="c k4"><div class="lab">สต๊อกคงเหลือ</div><div class="val">'+k.stock+' <small>คัน</small></div>'
+ '<div class="sub">ทุนจม '+B(k.cost)+' ฿ · ค้างเกิน '+D.aging+' วัน '+k.stuck+' คัน</div></div>'

+ '<div class="c k2"><div class="lab">งานที่ยังค้าง</div><div class="val">'+(k.regWait+k.svOpen+k.careDue)+' <small>รายการ</small></div>'
+ '<div class="sub">ทะเบียน '+k.regWait+' · ซ่อม '+k.svOpen+' · ตามลูกค้า '+k.careDue+'</div></div>';
setTheme();
</script>
</body></html>
