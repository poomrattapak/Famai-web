<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>แบบ 4 · เบนโตะเน้นสต๊อก — Famai Motor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ แบบ 4 · เบนโตะเน้นสต๊อก ============
   ต่างจากตัวอื่นตรง: โทนเย็น (น้ำเงิน-มิ้นต์) · การ์ดเล็กเยอะ ข้อมูลแน่นที่สุดในชุด ·
   เรื่องที่เล่าคือ "รถอยู่ไหน อายุเท่าไร รุ่นอะไร" · กราฟเป็นโดนัทซ้อนวงและแท่งแนวนอนหัวมน
   ใช้เมื่อ: ดูบนจอคอมที่ร้าน อยากเห็นสต๊อกทั้งหมดในหน้าจอเดียว */
:root{
  --bg:#EFF4F8; --card:#FFFFFF; --ink:#0C1B26; --dim:#5E7386; --line:rgba(12,27,38,.09);
  --c1:#1D6FC7; --c2:#17A398; --c3:#5B9BD5; --c4:#0E4F82; --c5:#7FCFC4; --c6:#9AB6CC;
  --hot:#C0392B; --tint:#E4EEF7; --r:20px;
}
html[data-theme="dark"]{ --bg:#080F16; --card:#111C26; --ink:#E4EDF4; --dim:#8FA6B8;
  --line:rgba(228,237,244,.10); --c1:#5AA9F5; --c2:#3FD6C6; --c3:#8CC0EE; --c4:#3D89C9;
  --c5:#A8E5DC; --c6:#7C97AC; --hot:#F0705F; --tint:#16242F; }
@media (prefers-color-scheme:dark){ html:not([data-theme="light"]){ --bg:#080F16; --card:#111C26; --ink:#E4EDF4;
  --dim:#8FA6B8; --line:rgba(228,237,244,.10); --c1:#5AA9F5; --c2:#3FD6C6; --c3:#8CC0EE;
  --c4:#3D89C9; --c5:#A8E5DC; --c6:#7C97AC; --hot:#F0705F; --tint:#16242F; } }
*{box-sizing:border-box;margin:0;padding:0}
body{ background:var(--bg); color:var(--ink); font-family:'Noto Sans Thai',system-ui,sans-serif; padding:18px; }
.wrap{ max-width:1240px; margin:0 auto; }
.switch{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:12px; margin-bottom:14px; }
.switch a{ color:var(--dim); text-decoration:none; padding:6px 12px; border-radius:99px; background:var(--card); }
.switch a.on{ color:var(--ink); font-weight:600; }
.switch a.home{ background:none; padding-left:0; }
.switch .tg{ margin-left:auto; background:var(--card); border:0; color:var(--dim); border-radius:99px; width:32px; height:32px; cursor:pointer; }
.top{ display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.top h1{ font-size:22px; font-weight:700; letter-spacing:-.02em; }
.top .p{ color:var(--dim); font-size:12.5px; }
.bento{ display:grid; grid-template-columns:repeat(6,1fr); gap:11px; }
.c{ background:var(--card); border-radius:var(--r); padding:15px 16px; border:1px solid var(--line);
  display:flex; flex-direction:column; min-height:104px; }
.c .lab{ font-size:11.5px; color:var(--dim); }
.c .val{ font-size:27px; font-weight:700; letter-spacing:-.03em; line-height:1.1; margin-top:auto;
  font-variant-numeric:tabular-nums; }
.c .val small{ font-size:13px; font-weight:500; color:var(--dim); letter-spacing:0; }
.c .sub{ font-size:11.5px; color:var(--dim); margin-top:5px; }
.c.w2{ grid-column:span 2; } .c.w3{ grid-column:span 3; } .c.w4{ grid-column:span 4; }
.c.h2{ grid-row:span 2; }
.c.tint{ background:var(--tint); border-color:transparent; }
.rings{ display:flex; align-items:center; gap:16px; margin-top:10px; flex-wrap:wrap; }
.lg{ font-size:11.5px; display:grid; gap:5px; }
.lg span{ display:flex; align-items:center; gap:7px; color:var(--dim); }
.lg i{ width:9px; height:9px; border-radius:99px; flex:0 0 9px; }
.hbar{ display:grid; gap:9px; margin-top:11px; }
.hbar .r{ display:flex; align-items:center; gap:9px; font-size:12px; }
.hbar .r span:first-child{ width:138px; flex:0 0 138px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hbar .tr{ flex:1; height:10px; border-radius:99px; background:var(--line); overflow:hidden; }
.hbar .tr i{ display:block; height:100%; border-radius:99px; }
.hbar b{ font-variant-numeric:tabular-nums; width:34px; text-align:right; }
.foot{ margin-top:16px; text-align:center; font-size:12px; color:var(--dim); }
@media (max-width:1000px){ .bento{ grid-template-columns:repeat(4,1fr); } .c.w4{ grid-column:span 4; } }
@media (max-width:700px){ .bento{ grid-template-columns:repeat(2,1fr); }
  .c.w3,.c.w4{ grid-column:1/-1; } .c.h2{ grid-row:auto; } }
@media (max-width:430px){ body{padding:13px} .bento{ gap:10px; } .c{ min-height:0; } .c .val{ font-size:24px; }
  /* จอแคบ: ชื่อขึ้นบรรทัดบน ไม่ตัดคำ — "Famai Motor Group" กับ "Famai Motor" ต้องแยกออกจากกัน */
  .hbar .r{ flex-wrap:wrap; }
  .hbar .r span:first-child{ width:auto; flex:1 1 100%; margin-bottom:2px; } }
</style></head><body>
<div class="wrap"><div id="sw"></div><div class="top" id="top"></div><div class="bento" id="app"></div>
<p class="foot">ตัวอย่างการออกแบบ · ตัวเลขจากข้อมูลสาธิตของระบบจริง — ทั้ง 6 แบบใช้ชุดตัวเลขเดียวกัน</p></div>
<script src="data.js"></script><script src="common.js"></script>
<script>
const k=D.kpi;
const COL=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
const model=Object.entries(D.stockModel).sort((a,b)=>b[1]-a[1]);
const tot=model.reduce((s,x)=>s+x[1],0);
let acc=0; const seg=model.map(([m,n],i)=>{ const from=acc/tot*100; acc+=n;
  return {m,n,c:COL[i%COL.length], from, to:acc/tot*100}; });
const br=Object.entries(D.stockBr), brMax=Math.max(...br.map(x=>x[1]));
const age=Object.entries(D.ageB), ageMax=Math.max(...age.map(x=>x[1]));
const dd=daily(), cv=curvePath(dd.map(x=>x.v), 300, 70, 8);
document.getElementById('sw').innerHTML = switcher('4');
document.getElementById('top').innerHTML = '<h1>สต๊อกรถทั้งเครือ</h1>'
  + '<span class="p">'+D.branches.length+' สาขา · '+D.period.text+' · อัปเดต '+thDate(D.today)+'</span>';
document.getElementById('app').innerHTML =
  '<div class="c w2 tint"><div class="lab">รถพร้อมขาย</div><div class="val">'+k.stock+' <small>คัน</small></div>'
+ '<div class="sub">ทุนจม '+B(k.cost)+' ฿</div></div>'
+ '<div class="c"><div class="lab">ค้างเกิน '+D.aging+' วัน</div><div class="val" style="color:var(--hot)">'+k.stuck+'</div><div class="sub">'+Math.round(k.stuck/Math.max(1,k.stock)*100)+'% ของสต๊อก</div></div>'
+ '<div class="c"><div class="lab">ขายออกในช่วง</div><div class="val">'+k.sold+'</div><div class="sub">'+B(k.rev)+' ฿</div></div>'
+ '<div class="c"><div class="lab">รุ่นที่มี</div><div class="val">'+model.length+'</div><div class="sub">แบบในสต๊อก</div></div>'
+ '<div class="c"><div class="lab">เฉลี่ยต่อสาขา</div><div class="val">'+Math.round(k.stock/Math.max(1,br.length))+'</div><div class="sub">คัน/สาขา</div></div>'

+ '<div class="c w3 h2"><div class="lab">สต๊อกแยกรุ่น</div>'
+ '<div class="rings"><svg width="148" height="148" viewBox="0 0 42 42">'
+ seg.map(s=>ringArc(s.from, s.to, s.c, 6.4)).join('')
+ '<text x="21" y="20.6" text-anchor="middle" font-size="7.4" font-weight="700" fill="currentColor">'+tot+'</text>'
+ '<text x="21" y="25.4" text-anchor="middle" font-size="3.2" fill="currentColor" opacity=".6">คันทั้งหมด</text></svg>'
+ '<div class="lg">'+seg.map(s=>'<span><i style="background:'+s.c+'"></i>'+s.m+' · <b>'+s.n+'</b>&nbsp;คัน</span>').join('')+'</div></div></div>'

+ '<div class="c w3"><div class="lab">คงเหลือรายสาขา</div><div class="hbar">'
+ br.map(([b,n],i)=>'<div class="r"><span>'+b+'</span>'
+   '<span class="tr"><i style="width:'+Math.round(n/brMax*100)+'%;background:'+COL[i%COL.length]+'"></i></span>'
+   '<b>'+n+'</b></div>').join('')
+ '</div></div>'

+ '<div class="c w3"><div class="lab">อายุรถในสต๊อก</div><div class="hbar">'
+ age.map(([a,n])=>'<div class="r"><span>'+a+' วัน</span>'
+   '<span class="tr"><i style="width:'+Math.round(n/ageMax*100)+'%;background:'+(a==='180+'?'var(--hot)':(a==='91-180'?'var(--c4)':'var(--c2)'))+'"></i></span>'
+   '<b>'+n+'</b></div>').join('')
+ '</div><div class="sub">แถบแดงคือเงินที่จอดอยู่เฉย ๆ นานที่สุด</div></div>'

+ '<div class="c w4"><div class="lab">จังหวะการขายในช่วงที่เลือก</div>'
+ '<svg viewBox="0 0 300 70" width="100%" height="74" preserveAspectRatio="none" style="margin-top:8px">'
+ '<defs><linearGradient id="g4" x1="0" y1="0" x2="0" y2="1">'
+ '<stop offset="0" stop-color="var(--c1)" stop-opacity=".3"/><stop offset="1" stop-color="var(--c1)" stop-opacity="0"/></linearGradient></defs>'
+ '<path d="'+cv.area+'" fill="url(#g4)"/>'
+ '<path d="'+cv.line+'" fill="none" stroke="var(--c1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
+ '<div class="sub">'+thShort(D.period.from)+' – '+thShort(D.period.to)+' · วันที่ขายดีสุด '+B(cv.max)+' ฿</div></div>'

+ '<div class="c w2"><div class="lab">รุ่นที่ขายออกช่วงนี้</div><div class="hbar" style="margin-top:9px">'
+ Object.entries(D.byModel).sort((a,b)=>b[1].n-a[1].n).map(([m,v],i)=>{
    const mx=Math.max(...Object.values(D.byModel).map(x=>x.n));
    return '<div class="r"><span>'+m+'</span><span class="tr"><i style="width:'+Math.round(v.n/mx*100)+'%;background:'+COL[i%COL.length]+'"></i></span><b>'+v.n+'</b></div>'; }).join('')
+ '</div></div>';
setTheme();
</script>
</body></html>
