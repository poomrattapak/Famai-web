<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>แบบ 3 · เบนโตะเน้นงานค้าง — Famai Motor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ แบบ 3 · เบนโตะเน้นงานค้าง ============
   ต่างจากตัวอื่นตรง: โทนอุ่น (ครีม-ส้มอิฐ-แดงดิน) · การ์ดขนาดกลางเท่า ๆ กันหลายใบ ·
   เรื่องที่เล่าคือ "อะไรค้างอยู่บ้าง" ไม่ใช่ยอดขาย · กราฟเป็นวงแหวนความคืบหน้าปลายมน
   ใช้เมื่อ: เปิดตอนเช้าแล้วอยากรู้ว่าวันนี้ต้องไล่อะไร */
:root{
  --bg:#FBF6EF; --card:#FFFDFA; --ink:#241A12; --dim:#8A7563; --line:rgba(36,26,18,.10);
  --hot:#C2410C; --mid:#D98324; --ok:#3F7D58; --cream:#F5E8D8; --r:24px;
}
html[data-theme="dark"]{ --bg:#14100C; --card:#1E1813; --ink:#F0E7DC; --dim:#A89685;
  --line:rgba(240,231,220,.11); --hot:#FB8A5C; --mid:#F0B45F; --ok:#63BC8A; --cream:#2A211A; }
@media (prefers-color-scheme:dark){ html:not([data-theme="light"]){ --bg:#14100C; --card:#1E1813; --ink:#F0E7DC;
  --dim:#A89685; --line:rgba(240,231,220,.11); --hot:#FB8A5C; --mid:#F0B45F; --ok:#63BC8A; --cream:#2A211A; } }
*{box-sizing:border-box;margin:0;padding:0}
body{ background:var(--bg); color:var(--ink); font-family:'Noto Sans Thai',system-ui,sans-serif; padding:20px; }
.wrap{ max-width:1160px; margin:0 auto; }
.switch{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:12px; margin-bottom:16px; }
.switch a{ color:var(--dim); text-decoration:none; padding:6px 12px; border-radius:99px; background:var(--card); }
.switch a.on{ color:var(--ink); font-weight:600; }
.switch a.home{ background:none; padding-left:0; }
.switch .tg{ margin-left:auto; background:var(--card); border:0; color:var(--dim); border-radius:99px; width:32px; height:32px; cursor:pointer; }
.top{ display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.top h1{ font-size:24px; font-weight:700; letter-spacing:-.02em; }
.top .p{ color:var(--dim); font-size:13px; }
.bento{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.c{ background:var(--card); border-radius:var(--r); padding:20px; border:1px solid var(--line);
  display:flex; flex-direction:column; min-height:148px; }
.c .lab{ font-size:12.5px; color:var(--dim); }
.c .val{ font-size:36px; font-weight:700; letter-spacing:-.03em; line-height:1.05; font-variant-numeric:tabular-nums; }
.c .sub{ font-size:12px; color:var(--dim); margin-top:6px; }
.c.wide{ grid-column:span 2; } .c.tall{ grid-row:span 2; }
.c.hot{ background:var(--cream); border-color:transparent; }
.ring{ display:flex; align-items:center; gap:16px; margin-top:auto; }
.ring .txt{ min-width:0; }
.chip{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; padding:4px 11px;
  border-radius:99px; background:var(--cream); color:var(--dim); width:fit-content; }
.q{ display:flex; align-items:center; gap:11px; padding:11px 0; border-top:1px solid var(--line); font-size:13.5px; }
.q:first-of-type{ border-top:0; }
.q .dot{ width:9px; height:9px; border-radius:99px; flex:0 0 9px; background:var(--mid); }
.q .dot.hot{ background:var(--hot); } .q .dot.ok{ background:var(--ok); }
.q .when{ margin-left:auto; font-size:11.5px; color:var(--dim); white-space:nowrap; }
.bars{ display:grid; gap:11px; margin-top:14px; }
.bar .row{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px; }
.bar .tr{ height:9px; border-radius:99px; background:var(--line); overflow:hidden; }
.bar .tr i{ display:block; height:100%; border-radius:99px; }
.foot{ margin-top:18px; text-align:center; font-size:12px; color:var(--dim); }
@media (max-width:900px){ .bento{ grid-template-columns:repeat(2,1fr); } .c.wide{ grid-column:1/-1; } .c.tall{ grid-row:auto; } }
@media (max-width:560px){ body{padding:14px} .bento{ grid-template-columns:1fr; gap:12px; } .c{ min-height:0; } }
</style></head><body>
<div class="wrap"><div id="sw"></div><div class="top" id="top"></div><div class="bento" id="app"></div>
<p class="foot">ตัวอย่างการออกแบบ · ตัวเลขจากข้อมูลสาธิตของระบบจริง — ทั้ง 6 แบบใช้ชุดตัวเลขเดียวกัน</p></div>
<script src="data.js"></script><script src="common.js"></script>
<script>
const k=D.kpi;
const dayTo = d => Math.round((new Date(d+'T00:00:00') - new Date(D.today+'T00:00:00'))/86400000);
/* งานทะเบียน: คิดความคืบหน้าเป็น % ของคันที่ส่งมอบแล้วเทียบกับที่ขายทั้งหมดในระบบ */
const regDone = Math.max(0, 100 - Math.round(k.regWait/Math.max(1,k.regWait+k.sold)*100));
const arDone = (k.rev+k.ar)? Math.round(k.rev/(k.rev+k.ar)*100) : 100;
const stockOk = Math.round((k.stock-k.stuck)/Math.max(1,k.stock)*100);
document.getElementById('sw').innerHTML = switcher('3');
document.getElementById('top').innerHTML = '<h1>อะไรค้างอยู่บ้าง</h1>'
  + '<span class="p">'+thDate(D.today)+' · '+D.branches.join(' · ')+'</span>';
const ring = (p,col,cap) => '<svg width="80" height="80" viewBox="0 0 42 42">'
  + ringGauge(p, col, 'var(--line)', 6)
  + '<text x="21" y="23.8" text-anchor="middle" font-size="8.5" font-weight="700" fill="currentColor">'+cap+'</text></svg>';
document.getElementById('app').innerHTML =
  '<div class="c wide hot"><div class="lab">งานทะเบียนที่ลูกค้ายังรอป้าย</div>'
+ '<div class="val" style="color:var(--hot)">'+k.regWait+' <span style="font-size:17px;color:var(--dim)">คัน</span></div>'
+ '<div class="ring">'+ring(regDone,'var(--hot)',regDone+'%')
+ '<div class="txt"><div class="sub" style="margin:0">ส่งมอบครบแล้วเทียบกับที่ขายไป — ยิ่งวงเต็มยิ่งไม่มีใครรอ</div>'
+ '<div class="chip" style="margin-top:8px">ใกล้ครบกำหนดสุด '+(D.todo[0]? thDate(D.todo[0].due):'—')+'</div></div></div></div>'

+ '<div class="c"><div class="lab">เงินค้างรับ</div>'
+ '<div class="val" style="color:var(--hot)">'+B(k.ar)+'</div>'
+ '<div class="ring">'+ring(arDone,'var(--ok)',arDone+'%')
+ '<div class="sub" style="margin:0">เก็บได้แล้ว<br>ค้าง '+k.arN+' ราย</div></div></div>'

+ '<div class="c"><div class="lab">รถค้างเกิน '+D.aging+' วัน</div>'
+ '<div class="val" style="color:var(--mid)">'+k.stuck+'</div>'
+ '<div class="ring">'+ring(stockOk,'var(--mid)',stockOk+'%')
+ '<div class="sub" style="margin:0">สต๊อกที่ยัง<br>หมุนได้ปกติ</div></div></div>'

+ '<div class="c wide tall"><div class="lab" style="margin-bottom:12px">คิวงานเรียงตามวันครบกำหนด</div>'
+ D.todo.map(t=>{ const d=dayTo(t.due);
    return '<div class="q"><span class="dot '+(d<0?'hot':(d<=7?'':'ok'))+'"></span>'
      +'<span>'+t.cust+'<div style="font-size:11.5px;color:var(--dim)">'+t.stage+'</div></span>'
      +'<span class="when">'+(d<0? 'เลย '+(-d)+' วัน' : (d===0?'วันนี้':'อีก '+d+' วัน'))+'</span></div>'; }).join('')
+ '</div>'

+ '<div class="c tall"><div class="lab">งานอื่นที่ค้างอยู่</div><div class="bars">'
+ [['ใบงานซ่อมยังไม่ปิด', k.svOpen, 'ใบ', 'var(--mid)'],
   ['อะไหล่ต่ำกว่าจุดสั่ง', k.lowParts, 'รายการ', 'var(--hot)'],
   ['ถึงรอบตามลูกค้า', k.careDue, 'ราย', 'var(--ok)']]
  .map(x=>'<div class="bar"><div class="row"><span>'+x[0]+'</span><b>'+x[1]+' '+x[2]+'</b></div>'
    +'<div class="tr"><i style="width:'+Math.min(100,x[1]*18+12)+'%;background:'+x[3]+'"></i></div></div>').join('')
+ '</div><div class="sub">ทั้งสามอย่างนี้ปล่อยไว้แล้วกลายเป็นเรื่องใหญ่ทีหลัง</div></div>'

+ '<div class="c"><div class="lab">ขายได้ในช่วงนี้</div><div class="val">'+k.sold+' <span style="font-size:17px;color:var(--dim)">คัน</span></div>'
+ '<div class="sub">ยอดขาย '+B(k.rev)+' ฿ · กำไร '+B(k.gp)+' ฿ — ใส่ไว้เป็นฉากหลัง ไม่ใช่พระเอกของหน้านี้</div></div>';
setTheme();
</script>
</body></html>
